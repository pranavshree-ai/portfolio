  <rect x="840" y="240" width="640" height="120" rx="14" fill="#090d14"/>
  <text x="870" y="280" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">CIFAR-10 Test Accuracy</text>
