  <circle cx="400" cy="440" r="80" fill="#F59E0B" fill-opacity="0.5" filter="blur(20px)"/>
  <circle cx="390" cy="430" r="40" fill="#10B981" fill-opacity="0.7" filter="blur(10px)"/>
  <text x="420" y="455" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">FOCAL REGION</text>

  <text x="120" y="700" font-family="'Inter', sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">Target layer: model.layer4[1].conv2</text>
