  <rect width="1600" height="900" fill="url(#visBg)"/>

  <!-- Top Bar -->
  <rect x="80" y="60" width="1440" height="70" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="120" cy="95" r="8" fill="#EF4444"/>
  <circle cx="145" cy="95" r="8" fill="#F59E0B"/>
