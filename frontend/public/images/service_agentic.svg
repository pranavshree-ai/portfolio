  <text x="660" y="485" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">with automated verification..."</text>

  <text x="640" y="585" font-family="'Inter', sans-serif" font-size="13" fill="#10B981">✓ Draft complete (1,420 tokens)</text>
  <text x="640" y="615" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">Anthropic Claude API (Sonnet)</text>

