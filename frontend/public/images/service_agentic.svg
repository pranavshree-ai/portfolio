  <text x="165" y="405" font-family="'Fira Code', monospace" font-size="12" fill="#E2E8F0">  topic: str</text>
  <text x="165" y="430" font-family="'Fira Code', monospace" font-size="12" fill="#E2E8F0">  key_arguments: List[str]</text>
  <text x="165" y="455" font-family="'Fira Code', monospace" font-size="12" fill="#E2E8F0">  target_audience: str</text>
  <text x="165" y="480" font-family="'Fira Code', monospace" font-size="12" fill="#E2E8F0">  tone: ToneEnum</text>
  <text x="165" y="505" font-family="'Fira Code', monospace" font-size="12" fill="#E2E8F0">  outline_sections: int</text>

