  <text x="1150" y="585" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#10B981">✓ 75% Reduction in Manual Time</text>
  <text x="1150" y="615" font-family="'Inter', sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">Auto-retry loop bypassed (score >= 9.0)</text>
