    <!-- Smile -->
    <path d="M30 62 Q50 82 70 62" stroke="#000" stroke-width="5.5" fill="#FFF" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="24" cy="54" r="6" fill="#FF7878" opacity="0.8"/>
    <circle cx="76" cy="54" r="6" fill="#FF7878" opacity="0.8"/>
