      <stop offset="0%" stop-color="#FFD21E" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="70" fill="url(#hfGlow)"/>
  <g transform="translate(56, 56) scale(0.88)">
